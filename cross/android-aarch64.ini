# SPDX-License-Identifier: MIT
#
# Android arm64 cross build (the RG 477V runs Android 14, API 34).
#
#   meson setup build-android --cross-file cross/android-aarch64.ini
#
# Build steps are in README.md.
# Requirements on the build machine:
#   - the Android NDK at `ndk` below (r28c = 28.2.13676358);
#   - rustc with the aarch64-linux-android standard library
#     (`rustup target add aarch64-linux-android`; Fedora's packaged rustc
#     does not ship it) plus a native rustc for the proc-macro crates;
#   - bindgen >= 0.71.1, not 0.72.0/0.73.0/0.73.1 (Mesa's rule), and a
#     libclang for it (any recent one; the NDK's is not needed);
#   - meson >= 1.7, ninja, Python 3 with mako and PyYAML.
# glslangValidator is not needed: a cross build builds no host tests.
# Override the NDK location by passing a second cross file that redefines
# `ndk` in a [constants] section before this one.

[constants]
ndk = '/home/bmd/Android/Sdk/ndk/28.2.13676358'
toolchain = ndk / 'toolchains/llvm/prebuilt/linux-x86_64'
api = '29'
triple = 'aarch64-linux-android'

[binaries]
c = toolchain / 'bin' / (triple + api + '-clang')
cpp = toolchain / 'bin' / (triple + api + '-clang++')
ar = toolchain / 'bin/llvm-ar'
strip = toolchain / 'bin/llvm-strip'
readelf = toolchain / 'bin/llvm-readelf'
rust = ['rustc', '--target', triple,
        '-C', 'linker=' + toolchain / 'bin' / (triple + api + '-clang')]
pkg-config = 'false'

[properties]
# bindgen runs libclang directly, which does not know the NDK sysroot.
# meson adds --target itself.
bindgen_clang_arguments = ['--sysroot=' + toolchain / 'sysroot',
                           '-D__ANDROID_API__=' + api]

[built-in options]
# Link the C++ runtime statically so the driver .so has no libc++_shared
# dependency inside the app.
cpp_link_args = ['-static-libstdc++']

[host_machine]
system = 'android'
subsystem = 'android'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8.2-a'
endian = 'little'
